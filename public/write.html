<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Write — prrath.notes</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="stylesheet" href="/write.css" />
<style>
  body { margin: 0; height: 100vh; overflow: hidden; }
  .bar { display: flex; align-items: center; gap: 1rem; padding: .7rem 1.1rem; border-bottom: 1px solid var(--rule); }
  .bar h1 { font-size: 1rem; margin: 0; font-weight: 600; }
  .seg { display: flex; gap: 0; border: 1px solid var(--rule-2); border-radius: 3px; overflow: hidden; }
  .seg button { font-family: var(--sans); font-size: .78rem; padding: .3rem .8rem; border: 0; background: #fff; color: var(--ink-2); cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }
  .bar .right { margin-left: auto; display: flex; align-items: center; gap: .8rem; }
  .status { font-family: var(--sans); font-size: .76rem; color: var(--ink-3); }
  .status.err { color: #a03318; }
  .status.ok { color: #1d6b3f; }
  button.save { font-family: var(--sans); font-size: .8rem; font-weight: 600; padding: .4rem 1rem; background: var(--ink); color: #fff; border: 0; border-radius: 3px; cursor: pointer; }
  button.save:disabled { background: var(--rule-2); cursor: default; }
  button.ghost { font-family: var(--sans); font-size: .78rem; background: none; border: 1px solid var(--rule-2); border-radius: 3px; padding: .35rem .7rem; color: var(--ink-2); cursor: pointer; }
  button.ghost:hover { border-color: var(--ink); color: var(--ink); }

  .split { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); height: calc(100vh - 3.3rem); }
  .pane { overflow-y: auto; padding: 1.3rem 1.5rem 4rem; }
  .pane.left { border-right: 1px solid var(--rule); }
  .pane.right { background: #fdfdfc; }

  label { display: block; font-family: var(--sans); font-size: .7rem; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); margin: 1rem 0 .25rem; }
  label:first-of-type { margin-top: 0; }
  input, textarea, select {
    width: 100%; font-family: var(--serif); font-size: .97rem; color: var(--ink);
    background: #fff; border: 1px solid var(--rule-2); border-radius: 2px; padding: .45rem .55rem;
  }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--ink); }
  textarea { resize: vertical; line-height: 1.55; }
  textarea.body { min-height: 20rem; font-family: var(--mono); font-size: .84rem; }
  .row { display: flex; gap: .7rem; }
  .row > div { flex: 1; }
  .ex-row { display: flex; gap: .4rem; margin-bottom: .35rem; }
  .ex-row input { flex: 1; }
  .ex-row button { border: 1px solid var(--rule-2); background: #fff; border-radius: 2px; width: 1.9rem; cursor: pointer; color: var(--ink-3); }
  .ex-row button:hover { border-color: #a03318; color: #a03318; }
  .hintline { font-family: var(--sans); font-size: .72rem; color: var(--ink-3); margin-top: .25rem; }
  .preview-label { font-family: var(--sans); font-size: .68rem; text-transform: uppercase; letter-spacing: .09em; color: var(--ink-3); margin-bottom: 1rem; }
  #preview img { max-width: 100%; height: auto; display: block; margin: 1rem 0; border: 1px solid var(--rule); }
  .warn { font-family: var(--sans); font-size: .76rem; color: #8a5a00; background: #fdf6e3; border: 1px solid #e8d9a8; border-radius: 3px; padding: .5rem .7rem; margin-top: .8rem; }
  .login-overlay[hidden] { display: none !important; }
  .login-overlay { position: fixed; inset: 0; background: #fff; z-index: 100; display: grid; place-items: center; padding: 1.5rem; }
  .login-card { width: 100%; max-width: 20rem; }
  .login-card h2 { margin: 0; font-size: 1.3rem; }
  .login-card .sub { margin: .2rem 0 1.5rem; color: var(--ink-3); font-family: var(--sans); font-size: .82rem; }
  .login-card label { margin-top: 0; }
  .login-card button { width: 100%; margin-top: .9rem; font-family: var(--sans); font-size: .85rem; font-weight: 600; padding: .55rem; background: var(--ink); color: #fff; border: 0; border-radius: 3px; cursor: pointer; }
  .login-card button:disabled { background: var(--rule-2); }
  .login-card .err { font-family: var(--sans); font-size: .78rem; color: #a03318; min-height: 1.1rem; margin: .5rem 0 0; }
  .login-card .hint-line { font-family: var(--sans); font-size: .74rem; color: var(--ink-3); margin: 1.2rem 0 0; }
  @media (max-width: 800px) {
    .split { grid-template-columns: 1fr; grid-template-rows: auto auto; height: auto; }
    body { overflow: auto; height: auto; }
    .pane.left { border-right: 0; border-bottom: 1px solid var(--rule); }
  }
</style>
</head>
<body data-mode="online">


<div id="login" class="login-overlay">
  <form class="login-card" id="login-form">
    <h2>prrath.notes</h2>
    <p class="sub">Private writing desk.</p>
    <label for="pw">Passphrase</label>
    <input id="pw" type="password" autocomplete="current-password" autofocus />
    <button type="submit" id="login-btn">Sign in</button>
    <p class="err" id="login-err"></p>
    <p class="hint-line">Hint: snap@RRR so whats it?</p>
  </form>
</div>

<div class="bar">
  <h1>Writing desk</h1>
  <div class="seg">
    <button id="t-word" aria-pressed="true">Word</button>
    <button id="t-blog" aria-pressed="false">Blog</button>
  </div>
  <div class="right">
    <span class="status" id="status"></span>
    <button class="ghost" id="clear">Clear</button>
    <button class="ghost" id="logout">Sign out</button>
    <button class="save" id="save">Save</button>
  </div>
</div>

<div class="split">
  <div class="pane left">
    <form id="form" autocomplete="off">
      <!-- word fields -->
      <div data-for="word">
        <label>Word</label>
        <input name="word" placeholder="petrichor" />
        <div class="row">
          <div>
            <label>Pronunciation</label>
            <input name="pronunciation" placeholder="/ˈpɛtrɪkɔːr/" />
          </div>
          <div>
            <label>Part of speech</label>
            <input name="partOfSpeech" placeholder="noun" list="pos" />
            <datalist id="pos">
              <option>noun</option><option>verb</option><option>adjective</option>
              <option>adverb</option><option>phrase</option>
            </datalist>
          </div>
        </div>
        <label>Meaning</label>
        <textarea name="meaning" rows="2" placeholder="The earthy smell that rises when rain falls on dry ground."></textarea>
        <label>Example sentences</label>
        <div id="examples"></div>
        <button type="button" class="ghost" id="add-ex">+ Add example</button>
        <label>Etymology</label>
        <textarea name="etymology" rows="2" placeholder="From Greek petra (stone) and ichor…"></textarea>
      </div>

      <!-- blog fields -->
      <div data-for="blog" hidden>
        <label>Title</label>
        <input name="title" placeholder="Why I started keeping this" />
        <label>Blurb</label>
        <textarea name="blurb" rows="2" placeholder="One line describing the post."></textarea>
      </div>

      <label>Tags</label>
      <input name="tags" placeholder="noun, sensory, favourite" />
      <div class="hintline">Comma separated.</div>

      <label>Date</label>
      <input name="added" type="date" />

      <label>Notes / body <span style="text-transform:none;letter-spacing:0;font-weight:400">— markdown, optional</span></label>
      <textarea name="body" class="body" placeholder="Write freely. **Bold**, *italic*, `code`, ## headings, - lists, tables.&#10;&#10;Link another entry with [[its-slug]]."></textarea>
      <div class="hintline">Use <code>[[slug]]</code> to link another entry. Paste or drop an image right into the box to add it.</div>

      <div id="dupe"></div>
    </form>
  </div>

  <div class="pane right">
    <div class="preview-label">Preview</div>
    <div id="preview"></div>
  </div>
</div>

<script type="module" src="/editor.js"></script>
</body>
</html>
